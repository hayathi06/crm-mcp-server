[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crm-mcp-server"
version = "1.0.0"
description = "An MCP server that lets AI assistants search, de-duplicate and route leads in a demo CRM."
readme = "README.md"
license = "MIT"
authors = [{ name = "Noor Hayathi Jamal Mohammed" }]
requires-python = ">=3.10"
dependencies = ["mcp>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
crm-mcp = "crm_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/crm_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
